# Evita que Supabase (plan gratuito) pause el proyecto por inactividad:
# cada 3 días llama a la función public.keepalive() (ver supabase/schema.sql).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *' # cada 3 días a las 06:17 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a keepalive()
        env:
          # Mismos valores públicos que src/core/sync/client.ts (la clave publishable es pública).
          SUPABASE_URL: https://qakodusxnrwkersrvgxt.supabase.co
          SUPABASE_KEY: sb_publishable_eNbdt5qbAQmCVTX97ctDxg_U6aGqcRj
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
